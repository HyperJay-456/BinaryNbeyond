<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2NKRTM6JXC"></script>
  <script>
   window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2NKRTM6JXC');
  </script>
  <meta charset="utf-8" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Number System Converter — Sci-Calc</title>

  <!-- daisyUI / Tailwind (keep your kit) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/numberConversions.css">
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <a class="sr-only focus:not-sr-only" href="#main">Skip to content</a>

  <!-- injected navbar -->
  <div id="navbar"></div>

  <main id="main" class="max-w-4xl mx-auto p-6">
    <section class="card p-6 shadow-sm rounded-lg mb-6 bg-white/80 dark:bg-gray-800/60">
      <h1 class="text-2xl font-semibold mb-4">Number System Converter</h1>

      <form id="number-system-form" class="grid gap-4" novalidate>
        <div>
          <label for="inputNumber" class="block text-sm mb-1">Enter Number</label>
          <input id="inputNumber" class="input w-full" placeholder="Enter number here" inputmode="text"
            autocomplete="off" />
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label for="fromBase" class="block text-sm mb-1">From Base</label>
            <select id="fromBase" class="select w-full">
              <option disabled value="">-- Select --</option>
              <option value="decimal">Decimal</option>
              <option value="binary">Binary</option>
              <option value="octal">Octal</option>
              <option value="hexadecimal">Hexadecimal</option>
            </select>
          </div>

          <div>
            <label for="toBase" class="block text-sm mb-1">To Base</label>
            <select id="toBase" class="select w-full">
              <option disabled value="">-- Select --</option>
              <option value="decimal">Decimal</option>
              <option value="binary">Binary</option>
              <option value="octal">Octal</option>
              <option value="hexadecimal">Hexadecimal</option>
            </select>
          </div>
        </div>

        <div class="flex gap-3">
          <button class="btn btn-primary" data-action="convert">Convert</button>
          <button class="btn text-black" type="button" data-action="clear">Clear</button>
        </div>
      </form>

      <hr class="my-4" />

      <h2 class="text-lg font-medium">Result</h2>
      <div id="resultOutput" class="mt-2 text-lg font-semibold"></div>

      <h3 class="mt-4 text-md font-medium">Step-by-Step Solution</h3>
      <div id="stepsOutput" class="steps mt-2"></div>

      <div id="errorOutput" class="mt-3 text-sm text-red-600" role="alert" aria-live="polite"></div>
    </section>

    <section class="card p-6 shadow-sm rounded-lg mb-6 bg-white/80 dark:bg-gray-800/60">
      <h2 class="text-2xl font-semibold mb-4">2's Complement Calculator</h2>

      <div>
        <label for="twosInput" class="block text-sm mb-1">Enter Binary Number</label>
        <input id="twosInput" class="input w-full" placeholder="e.g. 1011" inputmode="numeric" />
      </div>

      <div class="mt-3 flex gap-3">
        <button class="btn initial-color" data-action="twos-calc">Find 2's Complement</button>
        <button class="btn initial-color" data-action="twos-clear" type="button">Clear</button>
      </div>

      <h3 class="mt-4 text-md font-medium">Result</h3>
      <div id="twosResult" class="mt-2"></div>

      <h3 class="mt-4 text-md font-medium">Step-by-Step Solution</h3>
      <div id="twosSteps" class="steps mt-2"></div>

      <div id="twosError" class="mt-3 text-sm text-red-600" role="alert" aria-live="polite"></div>
    </section>

    <section class="card p-6 shadow-sm rounded-lg bg-white/80 dark:bg-gray-800/60">
      <h2 class="text-2xl font-semibold mb-4">Practice Mode</h2>

      <p id="practiceQuestion" class="mb-2 text-sm text-gray-600 dark:text-gray-300">Click "New Question" to start</p>

      <input id="practiceAnswer" class="input w-full mb-2" placeholder="Enter your answer here" />

      <div class="flex gap-3 mb-3">
        <button class="btn initial-color" data-action="practice-new">New Question</button>
        <button class="btn initial-color" data-action="practice-check">Check Answer</button>
      </div>

      <div id="practiceResult" class="mt-2"></div>

      <div class="mt-4">
        <button class="btn initial-color" data-action="practice-steps">Show Solution Steps</button>
      </div>

      <div id="practiceSteps" class="steps mt-2"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <!-- conversion logic (your existing modules) - load with defer and keep order -->
  <script src="js/conversions/validations.js" defer></script>

  <script src="js/conversions/binaryToDecimal.js" defer></script>
  <script src="js/conversions/octalToDecimal.js" defer></script>
  <script src="js/conversions/hexadecimalToDecimal.js" defer></script>

  <script src="js/conversions/decimalToBinary.js" defer></script>
  <script src="js/conversions/decimalToOctal.js" defer></script>
  <script src="js/conversions/decimalToHexadecimal.js" defer></script>

  <script src="js/conversions/baseToDecimal.js" defer></script>
  <script src="js/conversions/decimalToBase.js" defer></script>

  <script src="js/conversions/binaryAddition.js" defer></script>
  <script src="js/conversions/twosComplement.js" defer></script>
  <script src="js/conversions/animateSteps.js" defer></script>

  <script src="js/conversions/practiceMode.js" defer></script>
  <script src="js/conversions/practiceHelpers.js" defer></script>

  <!-- your controller that wires conversions (must define convertNumber, clearAll, etc.) -->
  <script src="js/conversions/controller.js" defer></script>

  <!-- UI glue that ensures the page is interactive & matches theme (fallbacks + sanitization) -->
  <script src="js/numberConversions-ui.js" defer></script>

  <!-- site-level script that injects navbar/footer + microinteractions -->
  <script src="js/script.js" defer></script>
</body>

</html>
