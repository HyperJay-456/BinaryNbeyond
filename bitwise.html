<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bitwise Operations</title>

  <!-- daisyUI / Tailwind (keep your existing kit if you prefer) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/bitwise.css">
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <a class="sr-only focus:not-sr-only" href="#main">Skip to content</a>

  <!-- navbar injected by js/script.js -->
  <div id="navbar"></div>

  <main id="main" class="max-w-4xl mx-auto p-6">
    <section class="card p-6 shadow-sm rounded-lg mb-8 bg-white/80 dark:bg-gray-800/60">
      <h1 class="text-2xl font-semibold mb-4">Bitwise Operations (AND / OR / XOR)</h1>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm mb-1">Number System</label>
          <select id="bitwiseSystem" class="select w-full">
            <option value="binary">Binary</option>
            <option value="decimal">Decimal</option>
          </select>
        </div>

        <div>
          <label class="block text-sm mb-1">Operation</label>
          <select id="bitwiseOperation" class="select w-full">
            <option value="and">AND</option>
            <option value="or">OR</option>
            <option value="xor">XOR</option>
          </select>
        </div>

        <div>
          <label class="block text-sm mb-1">First Number</label>
          <input id="bitwiseNum1" class="input w-full" inputmode="numeric" />
        </div>

        <div>
          <label class="block text-sm mb-1">Second Number</label>
          <input id="bitwiseNum2" class="input w-full" inputmode="numeric" />
        </div>
      </div>

      <div class="mt-4 flex gap-3">
        <button class="btn btn-primary" data-action="bitwise-calc">Calculate</button>
        <button class="btn initial-color" data-action="bitwise-clear">Clear</button>
      </div>

      <hr class="my-4" />

      <h2 class="text-lg font-medium">Result</h2>
      <div id="bitwiseResult" class="mt-2 text-lg font-semibold"></div>

      <h3 class="mt-4 text-md font-medium">Step-by-Step Solution</h3>
      <div id="bitwiseSteps" class="steps mt-2"></div>

      <div id="bitwiseError" class="mt-3 text-sm text-red-600" role="alert" aria-live="polite"></div>
    </section>

    <section class="card p-6 shadow-sm rounded-lg bg-white/80 dark:bg-gray-800/60">
      <h2 class="text-xl font-semibold mb-4">Practice Mode — Bitwise</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm mb-1">Difficulty</label>
          <select id="bitwiseDifficulty" class="select w-full">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div>
          <label class="block text-sm mb-1">Your Answer</label>
          <input id="bitwisePracticeAnswer" class="input w-full" inputmode="numeric"
            placeholder="Enter decimal result" />
        </div>
      </div>

      <p id="bitwisePracticeQuestion" class="mt-4 text-sm text-gray-600 dark:text-gray-300">Click "New Question" to
        start</p>

      <div class="mt-4 flex gap-3">
        <button class="btn initial-color" data-action="bitwise-new-question">New Question</button>
        <button class="btn initial-color" data-action="bitwise-check-answer">Check Answer</button>
        <button class="btn initial-color" data-action="bitwise-show-steps">Show Steps</button>
      </div>

      <div id="bitwisePracticeResult" class="mt-3"></div>

      <h3 class="mt-4 text-md font-medium">Practice Step-by-Step</h3>
      <div id="bitwisePracticeSteps" class="steps mt-2"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <!-- optional helpers your project may use -->
  <script src="js/conversions/validations.js" defer></script>
  <script src="js/conversions/animateSteps.js" defer></script>

  <!-- page logic (bitwise) -->
  <script src="js/bitwise/bitwise.js" defer></script>

  <!-- site-level script that injects navbar/footer + microinteractions -->
  <script src="js/script.js" defer></script>
</body>

</html>
